<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cool Minimal Website</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      animation: fadeInDown 1s ease forwards;
    }

    p {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      animation: fadeInUp 1s ease forwards;
    }

    a.button {
      display: inline-block;
      padding: 12px 24px;
      margin: 10px;
      border: 2px solid #fff;
      border-radius: 30px;
      text-decoration: none;
      color: #fff;
      transition: 0.3s ease;
    }

    a.button:hover {
      background: #fff;
      color: #2c5364;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <h1>Welcome to My Cool Site ✨</h1>
  <p>This is a clean, single-file HTML page with modern vibes.</p>
  <a href="#!" class="button" onclick="alert('You clicked the button!')">Click Me</a>
  <a href="#!" class="button">Another Button</a>

  <footer>Made with ❤️ in 2025</footer>
</body>
</html>
